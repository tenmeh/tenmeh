<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Tanmay Chanda. Notes on R, Shiny, and building things that other people use.">
<title>Tanmay Chanda. Notes on R, Shiny, and building things that other people use.</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #17202a; }
  .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
  .muted { fill: #566176; }
  .accent { fill: #1B6A70; }
  .shine { animation: shine 2.4s ease-in-out infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes shine { from { transform: translateX(-420px); } to { transform: translateX(520px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .shine, .cursor { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="#fbf8f1" stroke="#cfc5b1"/>

<defs>
  <clipPath id="skel"><rect x="0" y="0" width="220" height="18" rx="9.0"/><rect x="0" y="34" width="330" height="10" rx="5.0"/><rect x="0" y="54" width="300" height="10" rx="5.0"/><rect x="0" y="74" width="250" height="10" rx="5.0"/><rect x="0" y="130" width="30" height="70" rx="4"/><rect x="46" y="160" width="30" height="40" rx="4"/><rect x="92" y="105" width="30" height="95" rx="4"/><rect x="138" y="145" width="30" height="55" rx="4"/><rect x="184" y="118" width="30" height="82" rx="4"/><rect x="230" y="170" width="30" height="30" rx="4"/><rect x="276" y="136" width="30" height="64" rx="4"/></clipPath>
  <linearGradient id="glow" x1="0" x2="1">
    <stop offset="0" stop-color="#fbf8f1" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#fbf8f1" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#fbf8f1" stop-opacity="0"/>
  </linearGradient>
</defs>
<text x="64" y="84" class="mono accent" font-size="18" letter-spacing="1">R / SHINY / OPEN SOURCE</text>
<text x="64" y="146" font-size="60" font-weight="700" letter-spacing="-1.5">Tanmay Chanda</text>
<text x="64" y="184" class="muted" font-size="24">Notes on R, Shiny, and building things</text>
<text x="64" y="216" class="muted" font-size="24">that other people use.</text>
<text x="64" y="258" class="mono accent" font-size="19">&gt; install.packages("rewind")<tspan class="cursor">_</tspan></text>
<g transform="translate(760 58)">
  <rect x="-28" y="-26" width="400" height="252" rx="12" fill="#f4efe4" stroke="#cfc5b1"/>
